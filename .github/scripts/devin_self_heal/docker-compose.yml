#
# Self-healing maintenance loop without gh-aw. Run from the repository root:
#
#   docker compose -f .github/scripts/devin_self_heal/docker-compose.yml run --rm self-heal
#
# Each service is one stage of the same image, so a scheduler (cron, Nomad,
# Kubernetes CronJob) can call whichever stage it owns.
x-self-heal: &self-heal
  build: .
  working_dir: /repo
  volumes:
    - ../../..:/repo
  environment:
    GITHUB_REPOSITORY: ${GITHUB_REPOSITORY:?set GITHUB_REPOSITORY=owner/name}
    GITHUB_TOKEN: ${GITHUB_TOKEN:-}
    DEVIN_API_KEY: ${DEVIN_API_KEY:-}
    DEVIN_ORG_ID: ${DEVIN_ORG_ID:-}
    DEVIN_MAX_ACU: ${DEVIN_MAX_ACU:-20}
    DEVIN_SESSION_TIMEOUT: ${DEVIN_SESSION_TIMEOUT:-4200}
    SELF_HEAL_MAX_ISSUES: ${SELF_HEAL_MAX_ISSUES:-5}
    SELF_HEAL_QUEUE_LABEL: ${SELF_HEAL_QUEUE_LABEL:-devin-remediate}

services:
  # Everything: scan, file deduplicated issues, remediate the queue.
  self-heal:
    <<: *self-heal
    command: ["all"]

  # Scan only; writes findings.json / findings.md, needs no credentials.
  scan:
    <<: *self-heal
    command: ["scan"]

  # File issues from an existing scan result.
  file-issues:
    <<: *self-heal
    command: ["file-issues"]

  # Remediate the queue (override with `run --rm remediate remediate --issue 2`).
  remediate:
    <<: *self-heal
    command: ["remediate", "--from-label", "devin-remediate"]
